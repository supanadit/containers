[project]
name = "grafana-alloy"
description = "Grafana Alloy telemetry collector"

# Values come from Dockerfile ARG (passed via -var) or environment.
[vars]
GRAFANA_ALLOY_VERSION = "1.12.1"
ARCH = "amd64"

# ============ 1. SYSTEM LAYER ============

# Binary-release container: Alloy ships a prebuilt zip. Only runtime libs are
# installed; curl stays for user-supplied hooks and health scripts.
[[components]]
name = "system-deps"
ops = [
  { packages = { runtime = ["curl", "ca-certificates", "tzdata", "procps"] } },
  { packages = ["locales"] },
  { raw = "echo 'en_US.UTF-8 UTF-8' >> /etc/locale.gen && locale-gen && update-locale LANG=en_US.UTF-8" },
]

# ============ 2. IDENTITY ============

# Alloy previously ran as root. A dedicated unprivileged account lets ezx drop
# privileges per node (process.user/group) while ezx itself stays PID 1.
[[components]]
name = "identity"
needs = ["system-deps"]
ops = [{ user = { name = "alloy", system = true, create_home = false } }]

# ============ 3. GRAFANA ALLOY ============

# Single static binary out of the release zip, plus the example config from the
# matching tag so a bare container has a working default.
[[components]]
name = "alloy"
needs = ["identity"]
ops = [
  { binary_install = { url = "https://github.com/grafana/alloy/releases/download/v${GRAFANA_ALLOY_VERSION}/alloy-linux-${ARCH}.zip", copy = [{ from = "alloy-linux-${ARCH}", to = "/usr/share/grafana/alloy", mode = "0755" }] } },
  { raw = "mkdir -p /etc/alloy && curl -fsSL https://raw.githubusercontent.com/grafana/alloy/v${GRAFANA_ALLOY_VERSION}/example-config.alloy -o /etc/alloy/config.alloy" },
  { verify = [{ file = "/usr/share/grafana/alloy" }, { file = "/etc/alloy/config.alloy" }] },
]

# ============ 4. IMAGE CLEANUP ============

# Strip the binary, remove docs/man and non-English locales. Forge filters the
# remove list to packages that are actually installed, so it stays portable.
[[components]]
name = "cleanup"
needs = ["alloy"]
ops = [
  { packages = { remove = ["nano", "vim-tiny", "less", "info", "install-info", "diffutils", "mailcap", "bsdmainutils", "gnupg", "gnupg-l10n", "gnupg-utils", "apt", "apt-utils", "pppoe", "pppoeconf", "pppconfig", "whois", "hostname", "kmod", "logrotate", "e2fsprogs-extra", "libsasl2-modules"] } },
  { raw = "strip --strip-unneeded /usr/share/grafana/alloy 2>/dev/null || true" },
  { raw = "find /usr/share -type d -name doc -exec rm -rf {} + 2>/dev/null || true" },
  { raw = "find /usr/share -type d -name man -exec rm -rf {} + 2>/dev/null || true" },
  { raw = "find /usr/share -type d -name info -exec rm -rf {} + 2>/dev/null || true" },
  { raw = "find /usr/share/locale -mindepth 1 -maxdepth 1 -type d ! -name 'en*' -exec rm -rf {} + 2>/dev/null || true" },
]
