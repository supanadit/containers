[project]
name = "grafana-loki"
description = "Grafana Loki log aggregation system"

[vars]
GRAFANA_LOKI_VERSION = "3.5.3"
ARCH = "amd64"

# ============ 1. SYSTEM LAYER ============
[[components]]
name = "system-deps"
ops = [
  { packages = { runtime = ["curl", "ca-certificates", "tzdata", "procps"] } },
  { packages = ["locales"] },
  { raw = "echo 'en_US.UTF-8 UTF-8' >> /etc/locale.gen && locale-gen && update-locale LANG=en_US.UTF-8" },
]

# ============ 2. IDENTITY ============
[[components]]
name = "identity"
needs = ["system-deps"]
ops = [{ user = { name = "loki", system = true, create_home = false } }]

# ============ 3. GRAFANA LOKI ============

# Single static binary out of the release zip, plus the upstream docker sample
# config (kept for reference; the bootstrap generates the live config from env).
[[components]]
name = "loki"
needs = ["identity"]
ops = [
  { binary_install = { url = "https://github.com/grafana/loki/releases/download/v${GRAFANA_LOKI_VERSION}/loki-linux-${ARCH}.zip", copy = [{ from = "loki-linux-${ARCH}", to = "/usr/share/grafana/loki", mode = "0755" }] } },
  { raw = "mkdir -p /etc/loki && curl -fsSL https://raw.githubusercontent.com/grafana/loki/v${GRAFANA_LOKI_VERSION}/cmd/loki/loki-docker-config.yaml -o /etc/loki/loki-sample.yaml" },
  { verify = [{ file = "/usr/share/grafana/loki" }, { file = "/etc/loki/loki-sample.yaml" }] },
]

# ============ 4. IMAGE CLEANUP ============
[[components]]
name = "cleanup"
needs = ["loki"]
ops = [
  { packages = { remove = ["nano", "vim-tiny", "less", "info", "install-info", "diffutils", "mailcap", "bsdmainutils", "gnupg", "gnupg-l10n", "gnupg-utils", "apt", "apt-utils", "pppoe", "pppoeconf", "pppconfig", "whois", "hostname", "kmod", "logrotate", "e2fsprogs-extra", "libsasl2-modules"] } },
  { raw = "strip --strip-unneeded /usr/share/grafana/loki 2>/dev/null || true" },
  { raw = "find /usr/share -type d -name doc -exec rm -rf {} + 2>/dev/null || true" },
  { raw = "find /usr/share -type d -name man -exec rm -rf {} + 2>/dev/null || true" },
  { raw = "find /usr/share -type d -name info -exec rm -rf {} + 2>/dev/null || true" },
  { raw = "find /usr/share/locale -mindepth 1 -maxdepth 1 -type d ! -name 'en*' -exec rm -rf {} + 2>/dev/null || true" },
]
