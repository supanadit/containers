# Extensions test — verify shared_preload_libraries and extension availability
services:
  postgresql:
    image: postgresql:test
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: testpass
      # Only preload extensions the image actually ships: a missing
      # shared_preload_libraries entry makes the server refuse to start.
      # (pg_partman_bgw used to be listed here but pg_partman is not built in.)
      POSTGRESQL_CONFIG_SHARED_PRELOAD_LIBRARIES: "pg_stat_statements,pgaudit,hypopg,pg_cron"
