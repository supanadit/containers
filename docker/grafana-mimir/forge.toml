[project]
name = "grafana-mimir"
description = "Grafana Mimir scalable long-term Prometheus storage"

[vars]
GRAFANA_MIMIR_VERSION = "2.17.1"
ARCH = "amd64"

# ============ 1. SYSTEM LAYER ============
[[components]]
name = "system-deps"
ops = [
  { packages = { runtime = ["ca-certificates", "curl", "tzdata", "procps"] } },
  { packages = ["locales"] },
  { raw = "echo 'en_US.UTF-8 UTF-8' >> /etc/locale.gen && locale-gen && update-locale LANG=en_US.UTF-8" },
  { raw = "update-ca-certificates" },
]

# ============ 2. IDENTITY ============
[[components]]
name = "identity"
needs = ["system-deps"]
ops = [{ user = { name = "mimir", system = true, create_home = false } }]

# ============ 3. GRAFANA MIMIR ============
#
# Mimir releases publish `mimir-linux-<arch>` as a bare binary under the
# `mimir-<version>` tag; newer releases may ship a .tar.gz or .zip. The
# upstream downloader tried each candidate in turn, and that fallback is kept
# here (a bare binary cannot go through forge's archive fetch).
[[components]]
name = "mimir"
needs = ["identity"]
ops = [
  { raw = """
set -e
base="https://github.com/grafana/mimir/releases/download/mimir-${GRAFANA_MIMIR_VERSION}"
case "${ARCH}" in
  amd64) artifact_arch=amd64 ;;
  arm64) artifact_arch=arm64 ;;
  *) echo "unsupported ARCH=${ARCH}" >&2; exit 1 ;;
esac
name="mimir-linux-${artifact_arch}"
mkdir -p /tmp/mimir /usr/share/grafana
found=""
for candidate in "${name}" "${name}.tar.gz" "${name}.zip"; do
  if curl -fL --retry 3 --retry-delay 2 -o "/tmp/mimir/${candidate}" "${base}/${candidate}"; then
    found="${candidate}"
    break
  fi
  rm -f "/tmp/mimir/${candidate}"
done
if [ -z "${found}" ]; then
  echo "Failed to download Grafana Mimir ${GRAFANA_MIMIR_VERSION} for ${artifact_arch}" >&2
  exit 1
fi
case "${found}" in
  *.zip) unzip -q "/tmp/mimir/${found}" -d /tmp/mimir/dist ;;
  *.tar.gz) mkdir -p /tmp/mimir/dist && tar -xzf "/tmp/mimir/${found}" -C /tmp/mimir/dist ;;
  *) install -m 0755 "/tmp/mimir/${found}" /usr/share/grafana/mimir ;;
esac
if [ ! -x /usr/share/grafana/mimir ]; then
  bin_path="$(find /tmp/mimir/dist -type f -name mimir -print -quit)"
  if [ -z "${bin_path}" ]; then
    echo "Unable to locate the Mimir binary in the downloaded archive" >&2
    exit 1
  fi
  cp -a "$(dirname "${bin_path}")/." /usr/share/grafana/
fi
chmod 0755 /usr/share/grafana/mimir
rm -rf /tmp/mimir
""" },
  { verify = [{ file = "/usr/share/grafana/mimir" }] },
]

# ============ 4. IMAGE CLEANUP ============
[[components]]
name = "cleanup"
needs = ["mimir"]
ops = [
  { packages = { remove = ["nano", "vim-tiny", "less", "info", "install-info", "diffutils", "mailcap", "bsdmainutils", "gnupg", "gnupg-l10n", "gnupg-utils", "apt", "apt-utils", "pppoe", "pppoeconf", "pppconfig", "whois", "hostname", "kmod", "logrotate", "e2fsprogs-extra", "libsasl2-modules"] } },
  { raw = "strip --strip-unneeded /usr/share/grafana/mimir 2>/dev/null || true" },
  { raw = "find /usr/share -type d -name doc -exec rm -rf {} + 2>/dev/null || true" },
  { raw = "find /usr/share -type d -name man -exec rm -rf {} + 2>/dev/null || true" },
  { raw = "find /usr/share -type d -name info -exec rm -rf {} + 2>/dev/null || true" },
  { raw = "find /usr/share/locale -mindepth 1 -maxdepth 1 -type d ! -name 'en*' -exec rm -rf {} + 2>/dev/null || true" },
]
