[project]
name = "prometheus"
description = "Prometheus monitoring system and time series database"

# Values come from Dockerfile ARG (passed via -var) or environment.
[vars]
PROMETHEUS_VERSION = "3.7.3"
ARCH = "amd64"

# ============ 1. SYSTEM LAYER ============

# Binary-release container: Prometheus ships prebuilt tarballs. Only runtime libs
# are installed; curl stays for user-supplied hooks and health scripts.
[[components]]
name = "system-deps"
ops = [
  { packages = { runtime = ["curl", "ca-certificates", "tzdata", "procps"] } },
  { packages = ["locales"] },
  { raw = "echo 'en_US.UTF-8 UTF-8' >> /etc/locale.gen && locale-gen && update-locale LANG=en_US.UTF-8" },
]

# ============ 2. IDENTITY ============

# Prometheus previously ran as root. A dedicated unprivileged account lets ezx
# drop privileges per node (process.user/group) while ezx itself stays PID 1.
[[components]]
name = "identity"
needs = ["system-deps"]
ops = [{ user = { name = "prometheus", system = true, create_home = false } }]

# ============ 3. PROMETHEUS ============

# Binary + promtool out of the release tarball. config/ and console
# templates/libraries ship with the tarball and are installed so the image has a
# working default layout.
[[components]]
name = "prometheus"
needs = ["identity"]
ops = [
  { binary_install = { url = "https://github.com/prometheus/prometheus/releases/download/v${PROMETHEUS_VERSION}/prometheus-${PROMETHEUS_VERSION}.linux-${ARCH}.tar.gz", copy = [
      { from = "prometheus-${PROMETHEUS_VERSION}.linux-${ARCH}/prometheus", to = "/usr/local/bin/prometheus", mode = "0755" },
      { from = "prometheus-${PROMETHEUS_VERSION}.linux-${ARCH}/promtool", to = "/usr/local/bin/promtool", mode = "0755" },
      { from = "prometheus-${PROMETHEUS_VERSION}.linux-${ARCH}/prometheus.yml", to = "/opt/container/prometheus.yml.default", mode = "0644" },
    ] } },
  { verify = [{ file = "/usr/local/bin/prometheus" }, { file = "/usr/local/bin/promtool" }] },
]

# ============ 4. IMAGE CLEANUP ============

# Strip binaries, remove docs/man and non-English locales. Forge filters the
# remove list to packages that are actually installed, so it stays portable
# across base images.
[[components]]
name = "cleanup"
needs = ["prometheus"]
ops = [
  { packages = { remove = ["nano", "vim-tiny", "less", "info", "install-info", "diffutils", "mailcap", "bsdmainutils", "gnupg", "gnupg-l10n", "gnupg-utils", "apt", "apt-utils", "pppoe", "pppoeconf", "pppconfig", "whois", "hostname", "kmod", "logrotate", "e2fsprogs-extra", "libsasl2-modules"] } },
  { raw = "strip --strip-unneeded /usr/local/bin/prometheus /usr/local/bin/promtool 2>/dev/null || true" },
  { raw = "find /usr/share -type d -name doc -exec rm -rf {} + 2>/dev/null || true" },
  { raw = "find /usr/share -type d -name man -exec rm -rf {} + 2>/dev/null || true" },
  { raw = "find /usr/share -type d -name info -exec rm -rf {} + 2>/dev/null || true" },
  { raw = "find /usr/share/locale -mindepth 1 -maxdepth 1 -type d ! -name 'en*' -exec rm -rf {} + 2>/dev/null || true" },
]
