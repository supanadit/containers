[project]
name = "grafana"
description = "Grafana analytics and monitoring platform"

# Values come from Dockerfile ARG (passed via -var) or environment.
[vars]
GRAFANA_VERSION = "12.2.1"
GRAFANA_EDITION = "oss"
# OSS asset is grafana-<ver>.linux-<arch>.tar.gz; enterprise adds a suffix
# (grafana-enterprise-<ver>...). Build with GRAFANA_EDITION_SUFFIX=-enterprise
# for the enterprise tarball; the directory inside follows the same name.
GRAFANA_EDITION_SUFFIX = ""
ARCH = "amd64"

# ============ 1. SYSTEM LAYER ============

# Binary-release container: Grafana ships prebuilt tarballs. Only runtime libs
# are installed; curl stays for user-supplied hooks and health scripts.
[[components]]
name = "system-deps"
ops = [
  { packages = { runtime = ["curl", "ca-certificates", "tzdata", "procps"] } },
  { packages = ["locales"] },
  { raw = "echo 'en_US.UTF-8 UTF-8' >> /etc/locale.gen && locale-gen && update-locale LANG=en_US.UTF-8" },
]

# ============ 2. IDENTITY ============

# Grafana previously ran as root. A dedicated unprivileged account lets ezx drop
# privileges per node (process.user/group) while ezx itself stays PID 1.
[[components]]
name = "identity"
needs = ["system-deps"]
ops = [{ user = { name = "grafana", system = true, create_home = false } }]

# ============ 3. GRAFANA ============

# The release tarball extracts to grafana[-enterprise]-<version>/; the whole tree
# is installed under /usr/share/grafana (homepath), matching upstream layout.
[[components]]
name = "grafana"
needs = ["identity"]
ops = [
  { source_install = { type = "archive", url = "https://dl.grafana.com/${GRAFANA_EDITION}/release/grafana${GRAFANA_EDITION_SUFFIX}-${GRAFANA_VERSION}.linux-${ARCH}.tar.gz", strategy = "none",
    after = [
      { raw = "mkdir -p /usr/share/grafana /etc/grafana/provisioning /var/lib/grafana/plugins && cp -a grafana${GRAFANA_EDITION_SUFFIX}-${GRAFANA_VERSION}/. /usr/share/grafana/ && chmod 0755 /usr/share/grafana/bin/grafana /usr/share/grafana/bin/grafana-server" },
      { raw = "chown -R grafana:grafana /usr/share/grafana /var/lib/grafana" },
    ],
    verify = [{ file = "/usr/share/grafana/bin/grafana" }] } },
]

# ============ 4. IMAGE CLEANUP ============

# Strip docs/man and non-English locales. Forge filters the remove list to
# packages that are actually installed, so it stays portable across base images.
[[components]]
name = "cleanup"
needs = ["grafana"]
ops = [
  { packages = { remove = ["nano", "vim-tiny", "less", "info", "install-info", "diffutils", "mailcap", "bsdmainutils", "gnupg", "gnupg-l10n", "gnupg-utils", "apt", "apt-utils", "pppoe", "pppoeconf", "pppconfig", "whois", "hostname", "kmod", "logrotate", "e2fsprogs-extra", "libsasl2-modules"] } },
  { raw = "find /usr/share -type d -name doc -exec rm -rf {} + 2>/dev/null || true" },
  { raw = "find /usr/share -type d -name man -exec rm -rf {} + 2>/dev/null || true" },
  { raw = "find /usr/share -type d -name info -exec rm -rf {} + 2>/dev/null || true" },
  { raw = "find /usr/share/locale -mindepth 1 -maxdepth 1 -type d ! -name 'en*' -exec rm -rf {} + 2>/dev/null || true" },
]
