name: Build and Publish Grafana Container
permissions:
  contents: read
  packages: write

on:
  push:
    tags:
      - "grafana-oss-*"

jobs:
  setup:
    runs-on: ubuntu-latest
    outputs:
      container: ${{ steps.extract.outputs.container }}
      revision: ${{ steps.extract.outputs.revision }}
      context: ${{ steps.versions.outputs.context }}
      version: ${{ steps.extract.outputs.version }}
    steps:
      - name: Extract container, edition, version and revision
        id: extract
        run: |
          TAG=${{ github.ref_name }}
          IFS='-' read -ra parts <<< "$TAG"
          CONTAINER=${parts[0]}
          EDITION=${parts[1]}
          VERSION=${parts[2]}
          REVISION=${parts[3]:1}  # Remove the 'r' prefix
          if [ ${#parts[@]} -eq 4 ] && [ "${EDITION}" = "oss" ] && [[ ${parts[3]} =~ ^r[0-9]+$ ]]; then
            echo "container=$CONTAINER" >> $GITHUB_OUTPUT
            echo "version=$VERSION" >> $GITHUB_OUTPUT
            echo "revision=$REVISION" >> $GITHUB_OUTPUT
          else
            echo "Invalid tag format for Grafana. Expected: grafana-oss-<version>-r<revision> (Enterprise is no longer built)"
            exit 1
          fi

      - name: Set context for Grafana
        id: versions
        run: |
          CONTEXT="docker/grafana"
          echo "context=$CONTEXT" >> $GITHUB_OUTPUT

  build:
    needs: setup
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GCR_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: ${{ needs.setup.outputs.context }}
          push: true
          build-args: |
            GRAFANA_VERSION=${{ needs.setup.outputs.version }}
            GO_VERSION=1.25.14
            NODE_VERSION=22.16.0
          tags: ghcr.io/${{ github.repository_owner }}/containers/${{ needs.setup.outputs.container }}:oss-${{ needs.setup.outputs.version }}-r${{ needs.setup.outputs.revision }}
          cache-from: type=registry,ref=ghcr.io/${{ github.repository }}:buildcache-release-grafana
          cache-to: type=registry,ref=ghcr.io/${{ github.repository }}:buildcache-release-grafana,mode=max,ignore-error=true
