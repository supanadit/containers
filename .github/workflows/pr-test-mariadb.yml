name: PR Test - MariaDB

permissions:
  contents: read

on:
  pull_request:
    branches: [main]
    paths:
      - 'docker/mariadb/**'
      - 'entrypoint.d/scripts/utils/**'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check if docs-only PR
        id: skip-check
        run: |
          if [[ "${{ github.event.pull_request.title }}" =~ ^docs(\(.+\))?: ]]; then
            echo "PR title starts with 'docs:', skipping tests"
            echo "skip=true" >> $GITHUB_OUTPUT
          else
            echo "run-tests=true" >> $GITHUB_OUTPUT
          fi

      - name: Set up Docker Buildx
        if: steps.skip-check.outputs.skip != 'true'
        uses: docker/setup-buildx-action@v3

      - name: Build MariaDB image (with gha cache)
        if: steps.skip-check.outputs.skip != 'true'
        run: |
          echo "Building MariaDB 11.8.3 for PR validation..."
          docker buildx build --load \
            --cache-from=type=gha \
            --cache-to=type=gha,mode=max \
            --build-arg MARIADB_VERSION=11.8.3 \
            -t mariadb:test \
            docker/mariadb/

      - name: Test — Smoke (minimal config)
        if: steps.skip-check.outputs.skip != 'true'
        run: docker/mariadb/tests/scripts/run-smoke.sh

      - name: Test — Edge cases (database, app user, root host)
        if: steps.skip-check.outputs.skip != 'true'
        run: docker/mariadb/tests/scripts/run-edge-cases.sh
