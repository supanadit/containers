name: cache-probe

on:
  push:
    paths:
      - '.cache-probe-trigger'

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Prepare Dockerfile
        run: |
          mkdir -p /tmp/probe
          printf 'FROM alpine:3.20\nRUN echo probe && mkdir -p /out && echo ok > /out/x\n' > /tmp/probe/Dockerfile

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build trivial image with gha cache (action)
        uses: docker/build-push-action@v5
        with:
          context: /tmp/probe
          load: true
          tags: cache-probe:1
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Check cache entries
        run: gh api "/repos/supanadit/containers/actions/caches" --jq '.total_count' || true
        env:
          GH_TOKEN: ${{ github.token }}
