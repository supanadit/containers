name: cache-probe

on:
  push:
    paths:
      - '.cache-probe-trigger'

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Show buildx + cache env
        run: |
          docker buildx version
          echo "--- cache-related env (names only) ---"
          env | grep -oE '^ACTIONS_[A-Z_]+' | sort || true

      - name: Build trivial image with gha cache
        run: |
          mkdir -p /tmp/probe
          printf 'FROM alpine:3.20\nRUN echo probe && mkdir -p /out && echo ok > /out/x\n' > /tmp/probe/Dockerfile
          docker buildx build --load --progress=plain \
            --cache-from=type=gha \
            --cache-to=type=gha,mode=max \
            -t cache-probe:1 /tmp/probe

      - name: Build again in the same job (selftest)
        run: |
          docker buildx build --load --progress=plain \
            --cache-from=type=gha \
            --cache-to=type=gha,mode=max \
            -t cache-probe:2 /tmp/probe
