name: PR Test - Thanos

on:
  pull_request:
    branches: [main]
    paths:
      - 'docker/thanos/**'

permissions:
  contents: read
  packages: write

concurrency:
  group: pr-test-thanos-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check if docs-only PR
        id: skip-check
        run: |
          if [[ "${{ github.event.pull_request.title }}" =~ ^docs(\(.+\))?: ]]; then
            echo "PR title starts with 'docs:', skipping tests"
            echo "skip=true" >> $GITHUB_OUTPUT
          else
            echo "run-tests=true" >> $GITHUB_OUTPUT
          fi

      - name: Set up Docker Buildx
        if: steps.skip-check.outputs.skip != 'true'
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR (registry build cache)
        if: steps.skip-check.outputs.skip != 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Thanos image (registry cache)
        if: steps.skip-check.outputs.skip != 'true'
        uses: docker/build-push-action@v5
        with:
          context: docker/thanos
          load: true
          tags: thanos:test
          # Registry cache lives in GHCR next to the images: unlike type=gha
          # it has no 10 GB repo-wide ceiling, so 21 images do not evict each
          # other. ignore-error keeps a failed export from failing the build.
          cache-from: type=registry,ref=ghcr.io/${{ github.repository }}:buildcache-thanos
          cache-to: type=registry,ref=ghcr.io/${{ github.repository }}:buildcache-thanos,mode=max,ignore-error=true

      - name: Test — Smoke (query component)
        if: steps.skip-check.outputs.skip != 'true'
        run: docker/thanos/tests/scripts/run-smoke.sh

      - name: Test — Edge cases (S3 objstore, validation)
        if: steps.skip-check.outputs.skip != 'true'
        run: docker/thanos/tests/scripts/run-edge-cases.sh
