name: PR Test - Thanos

on:
  pull_request:
    branches: [main]
    paths:
      - 'docker/thanos/**'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check if docs-only PR
        id: skip-check
        run: |
          if [[ "${{ github.event.pull_request.title }}" =~ ^docs(\(.+\))?: ]]; then
            echo "PR title starts with 'docs:', skipping tests"
            echo "skip=true" >> $GITHUB_OUTPUT
          else
            echo "run-tests=true" >> $GITHUB_OUTPUT
          fi

      - name: Set up Docker Buildx
        if: steps.skip-check.outputs.skip != 'true'
        uses: docker/setup-buildx-action@v3

      - name: Build Thanos image (with gha cache)
        if: steps.skip-check.outputs.skip != 'true'
        uses: docker/build-push-action@v5
        with:
          context: docker/thanos
          load: true
          tags: thanos:test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Test — Smoke (query component)
        if: steps.skip-check.outputs.skip != 'true'
        run: docker/thanos/tests/scripts/run-smoke.sh

      - name: Test — Edge cases (S3 objstore, validation)
        if: steps.skip-check.outputs.skip != 'true'
        run: docker/thanos/tests/scripts/run-edge-cases.sh
