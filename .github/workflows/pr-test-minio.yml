name: PR Test - MinIO

on:
  pull_request:
    branches: [main]
    paths:
      - 'docker/minio/**'

permissions:
  contents: read

concurrency:
  group: pr-test-minio-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check if docs-only PR
        id: skip-check
        run: |
          if [[ "${{ github.event.pull_request.title }}" =~ ^docs(\(.+\))?: ]]; then
            echo "PR title starts with 'docs:', skipping tests"
            echo "skip=true" >> $GITHUB_OUTPUT
          else
            echo "run-tests=true" >> $GITHUB_OUTPUT
          fi

      - name: Set up Docker Buildx
        if: steps.skip-check.outputs.skip != 'true'
        uses: docker/setup-buildx-action@v3

      - name: Build MinIO image (with gha cache)
        if: steps.skip-check.outputs.skip != 'true'
        uses: docker/build-push-action@v5
        with:
          context: docker/minio
          load: true
          tags: minio:test
          cache-from: type=gha,scope=minio
          cache-to: type=gha,mode=max,scope=minio

      - name: Test — Smoke (standalone server)
        if: steps.skip-check.outputs.skip != 'true'
        run: docker/minio/tests/scripts/run-smoke.sh

      - name: Test — Edge cases (credentials, validation)
        if: steps.skip-check.outputs.skip != 'true'
        run: docker/minio/tests/scripts/run-edge-cases.sh
