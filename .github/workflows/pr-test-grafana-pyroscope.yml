name: PR Test - Grafana Pyroscope

permissions:
  contents: read
  packages: write

on:
  pull_request:
    branches: [main]
    paths:
      - 'docker/grafana-pyroscope/**'

concurrency:
  group: pr-test-grafana-pyroscope-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check if docs-only PR
        id: skip-check
        run: |
          if [[ "${{ github.event.pull_request.title }}" =~ ^docs(\(.+\))?: ]]; then
            echo "PR title starts with 'docs:', skipping tests"
            echo "skip=true" >> $GITHUB_OUTPUT
          else
            echo "run-tests=true" >> $GITHUB_OUTPUT
          fi

      - name: Set up Docker Buildx
        if: steps.skip-check.outputs.skip != 'true'
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR (registry build cache)
        if: steps.skip-check.outputs.skip != 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # No build-args: the Dockerfile ARG defaults are the versions under test.
      - name: Build Grafana Pyroscope image (registry cache)
        if: steps.skip-check.outputs.skip != 'true'
        uses: docker/build-push-action@v5
        with:
          context: docker/grafana-pyroscope
          load: true
          tags: pyroscope:test
          # Registry cache lives in GHCR next to the images: unlike type=gha
          # it has no 10 GB repo-wide ceiling, so 21 images do not evict each
          # other. ignore-error keeps a failed export from failing the build.
          cache-from: type=registry,ref=ghcr.io/${{ github.repository }}:buildcache-grafana-pyroscope
          cache-to: type=registry,ref=ghcr.io/${{ github.repository }}:buildcache-grafana-pyroscope,mode=max,ignore-error=true

      - name: Run test suites
        if: steps.skip-check.outputs.skip != 'true'
        run: |
          set -euo pipefail
          shopt -s nullglob
          suites=(docker/grafana-pyroscope/tests/scripts/run-*.sh)
          if [ ${#suites[@]} -eq 0 ]; then
            echo "::error::no tests/scripts/run-*.sh under docker/grafana-pyroscope/tests"
            exit 1
          fi
          for suite in "${suites[@]}"; do
            echo "::group::$(basename "$suite")"
            if ! bash "$suite"; then
              echo "::endgroup::"
              echo "::error::Grafana Pyroscope: $(basename "$suite") failed"
              exit 1
            fi
            echo "::endgroup::"
          done
