name: PR Test - PostgreSQL

permissions:
  contents: read
  packages: write

on:
  pull_request:
    branches: [main]
    paths:
      - 'docker/postgresql/**'
      - 'entrypoint.d/scripts/utils/**'

concurrency:
  group: pr-test-postgresql-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check if docs-only PR
        id: skip-check
        run: |
          if [[ "${{ github.event.pull_request.title }}" =~ ^docs(\(.+\))?: ]]; then
            echo "PR title starts with 'docs:', skipping tests"
            echo "skip=true" >> $GITHUB_OUTPUT
          else
            echo "run-tests=true" >> $GITHUB_OUTPUT
          fi

      - name: Set up Docker Buildx
        if: steps.skip-check.outputs.skip != 'true'
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR (registry build cache)
        if: steps.skip-check.outputs.skip != 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build PostgreSQL image (registry cache)
        if: steps.skip-check.outputs.skip != 'true'
        uses: docker/build-push-action@v5
        with:
          context: docker/postgresql
          load: true
          tags: postgresql:test
          # Registry cache lives in GHCR next to the images: unlike type=gha
          # it has no 10 GB repo-wide ceiling, so 21 images do not evict each
          # other. ignore-error keeps a failed export from failing the build.
          cache-from: type=registry,ref=ghcr.io/${{ github.repository }}:buildcache-postgresql
          cache-to: type=registry,ref=ghcr.io/${{ github.repository }}:buildcache-postgresql,mode=max,ignore-error=true
          build-args: |
            POSTGRESQL_VERSION=18.1
            CITUS_VERSION=14.0.0
            PATRONI_VERSION=v4.1.0
            PYTHON_VERSION=v3.13.9
            PGAUDIT_VERSION=18.0

      - name: Test — Smoke (minimal config)
        if: steps.skip-check.outputs.skip != 'true'
        run: docker/postgresql/tests/scripts/run-smoke.sh

      - name: Test — Extensions
        if: steps.skip-check.outputs.skip != 'true'
        run: docker/postgresql/tests/scripts/run-extensions.sh

      - name: Test — PgBouncer
        if: steps.skip-check.outputs.skip != 'true'
        run: docker/postgresql/tests/scripts/run-pgbouncer.sh

      - name: Test — pgBackRest
        if: steps.skip-check.outputs.skip != 'true'
        run: docker/postgresql/tests/scripts/run-pgbackrest.sh

      - name: Test — PgBouncer + pgBackRest combined
        if: steps.skip-check.outputs.skip != 'true'
        run: docker/postgresql/tests/scripts/run-pgbouncer+pgbackrest.sh
