name: PR Test - PostgreSQL

on:
  pull_request:
    branches: [main]
    paths:
      - 'docker/postgresql/**'
      - 'entrypoint.d/scripts/utils/**'

concurrency:
  group: pr-test-postgresql-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check if docs-only PR
        id: skip-check
        run: |
          if [[ "${{ github.event.pull_request.title }}" =~ ^docs(\(.+\))?: ]]; then
            echo "PR title starts with 'docs:', skipping tests"
            echo "skip=true" >> $GITHUB_OUTPUT
          else
            echo "run-tests=true" >> $GITHUB_OUTPUT
          fi

      - name: Set up Docker Buildx
        if: steps.skip-check.outputs.skip != 'true'
        uses: docker/setup-buildx-action@v3

      - name: Build PostgreSQL image (with gha cache)
        if: steps.skip-check.outputs.skip != 'true'
        uses: docker/build-push-action@v5
        with:
          context: docker/postgresql
          load: true
          tags: postgresql:test
          cache-from: type=gha,scope=postgresql
          cache-to: type=gha,mode=max,scope=postgresql
          build-args: |
            POSTGRESQL_VERSION=18.1
            CITUS_VERSION=14.0.0
            PATRONI_VERSION=v4.1.0
            PYTHON_VERSION=v3.13.9
            PGAUDIT_VERSION=18.0

      - name: Test — Smoke (minimal config)
        if: steps.skip-check.outputs.skip != 'true'
        run: docker/postgresql/tests/scripts/run-smoke.sh

      - name: Test — Extensions
        if: steps.skip-check.outputs.skip != 'true'
        run: docker/postgresql/tests/scripts/run-extensions.sh

      - name: Test — PgBouncer
        if: steps.skip-check.outputs.skip != 'true'
        run: docker/postgresql/tests/scripts/run-pgbouncer.sh

      - name: Test — pgBackRest
        if: steps.skip-check.outputs.skip != 'true'
        run: docker/postgresql/tests/scripts/run-pgbackrest.sh

      - name: Test — PgBouncer + pgBackRest combined
        if: steps.skip-check.outputs.skip != 'true'
        run: docker/postgresql/tests/scripts/run-pgbouncer+pgbackrest.sh
