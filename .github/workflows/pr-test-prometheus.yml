name: PR Test - Prometheus

on:
  pull_request:
    branches: [main]
    paths:
      - 'docker/prometheus/**'

permissions:
  contents: read

concurrency:
  group: pr-test-prometheus-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check if docs-only PR
        id: skip-check
        run: |
          if [[ "${{ github.event.pull_request.title }}" =~ ^docs(\(.+\))?: ]]; then
            echo "PR title starts with 'docs:', skipping tests"
            echo "skip=true" >> $GITHUB_OUTPUT
          else
            echo "run-tests=true" >> $GITHUB_OUTPUT
          fi

      - name: Set up Docker Buildx
        if: steps.skip-check.outputs.skip != 'true'
        uses: docker/setup-buildx-action@v3

      - name: Build Prometheus image (with gha cache)
        if: steps.skip-check.outputs.skip != 'true'
        uses: docker/build-push-action@v5
        with:
          context: docker/prometheus
          load: true
          tags: prometheus:test
          cache-from: type=gha,scope=prometheus
          cache-to: type=gha,mode=max,scope=prometheus

      - name: Test — Smoke (bundled default config)
        if: steps.skip-check.outputs.skip != 'true'
        run: docker/prometheus/tests/scripts/run-smoke.sh

      - name: Test — Edge cases (custom config, missing config)
        if: steps.skip-check.outputs.skip != 'true'
        run: docker/prometheus/tests/scripts/run-edge-cases.sh
