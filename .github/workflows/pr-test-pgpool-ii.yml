name: PR Test - PgPool-II

on:
  pull_request:
    branches: [main]
    paths:
      - 'docker/pgpool-ii/**'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check if docs-only PR
        id: skip-check
        run: |
          if [[ "${{ github.event.pull_request.title }}" =~ ^docs(\(.+\))?: ]]; then
            echo "PR title starts with 'docs:', skipping tests"
            echo "skip=true" >> $GITHUB_OUTPUT
          else
            echo "run-tests=true" >> $GITHUB_OUTPUT
          fi

      - name: Set up Docker Buildx
        if: steps.skip-check.outputs.skip != 'true'
        uses: docker/setup-buildx-action@v3

      - name: Build PgPool-II image (with gha cache)
        if: steps.skip-check.outputs.skip != 'true'
        run: |
          echo "Building PgPool-II for PR validation..."
          docker buildx build --load \
            --cache-from=type=gha \
            --cache-to=type=gha,mode=max \
            -t pgpool-ii:test \
            docker/pgpool-ii/

      - name: Test — Smoke (config generation, no backends)
        if: steps.skip-check.outputs.skip != 'true'
        run: docker/pgpool-ii/tests/scripts/run-smoke.sh

      - name: Test — Edge cases (validation)
        if: steps.skip-check.outputs.skip != 'true'
        run: docker/pgpool-ii/tests/scripts/run-edge-cases.sh
