name: PR Test - Grafana

permissions:
  contents: read

on:
  pull_request:
    branches: [main]
    paths:
      - 'docker/grafana/**'

concurrency:
  group: pr-test-grafana-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check if docs-only PR
        id: skip-check
        run: |
          if [[ "${{ github.event.pull_request.title }}" =~ ^docs(\(.+\))?: ]]; then
            echo "PR title starts with 'docs:', skipping tests"
            echo "skip=true" >> $GITHUB_OUTPUT
          else
            echo "run-tests=true" >> $GITHUB_OUTPUT
          fi

      - name: Set up Docker Buildx
        if: steps.skip-check.outputs.skip != 'true'
        uses: docker/setup-buildx-action@v3

      # No build-args: the Dockerfile ARG defaults are the versions under test.
      #
      # cache-from only: `yarn install && make build` lands in a single 5.5 GB
      # layer, which is more than half of the 10 GB repo-wide Actions cache and
      # evicts every other container's cache. Grafana changes rarely, so it
      # rebuilds cold (~30 min) rather than starving the other 20 workflows.
      # Move it to a registry cache (type=registry, ref=ghcr.io/...:buildcache-grafana)
      # if that cost ever matters.
      - name: Build Grafana image (gha cache read-only)
        if: steps.skip-check.outputs.skip != 'true'
        uses: docker/build-push-action@v5
        with:
          context: docker/grafana
          load: true
          tags: grafana:test
          cache-from: type=gha,scope=grafana

      - name: Run test suites
        if: steps.skip-check.outputs.skip != 'true'
        run: |
          set -euo pipefail
          shopt -s nullglob
          suites=(docker/grafana/tests/scripts/run-*.sh)
          if [ ${#suites[@]} -eq 0 ]; then
            echo "::error::no tests/scripts/run-*.sh under docker/grafana/tests"
            exit 1
          fi
          for suite in "${suites[@]}"; do
            echo "::group::$(basename "$suite")"
            if ! bash "$suite"; then
              echo "::endgroup::"
              echo "::error::Grafana: $(basename "$suite") failed"
              exit 1
            fi
            echo "::endgroup::"
          done
