name: PR Test - Flink

permissions:
  contents: read

on:
  pull_request:
    branches: [main]
    paths:
      - 'docker/apache-flink/**'

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check if docs-only PR
        id: skip-check
        run: |
          if [[ "${{ github.event.pull_request.title }}" =~ ^docs(\(.+\))?: ]]; then
            echo "PR title starts with 'docs:', skipping tests"
            echo "skip=true" >> $GITHUB_OUTPUT
          else
            echo "run-tests=true" >> $GITHUB_OUTPUT
          fi

      - name: Set up Docker Buildx
        if: steps.skip-check.outputs.skip != 'true'
        uses: docker/setup-buildx-action@v3

      # No build-args: the Dockerfile ARG defaults are the versions under test.
      - name: Build Flink image (with gha cache)
        if: steps.skip-check.outputs.skip != 'true'
        uses: docker/build-push-action@v5
        with:
          context: docker/apache-flink
          load: true
          tags: flink:test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Run test suites
        if: steps.skip-check.outputs.skip != 'true'
        run: |
          set -euo pipefail
          shopt -s nullglob
          suites=(docker/apache-flink/tests/scripts/run-*.sh)
          if [ ${#suites[@]} -eq 0 ]; then
            echo "::error::no tests/scripts/run-*.sh under docker/apache-flink/tests"
            exit 1
          fi
          for suite in "${suites[@]}"; do
            echo "::group::$(basename "$suite")"
            if ! bash "$suite"; then
              echo "::endgroup::"
              echo "::error::Flink: $(basename "$suite") failed"
              docker ps -a
              for c in $(docker ps -aq); do
                echo "=== logs: $c"
                docker logs "$c" 2>&1 | tail -80
              done
              exit 1
            fi
            echo "::endgroup::"
          done
